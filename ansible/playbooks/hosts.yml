---
- name: Configure Proxmox fabric for OSPF broadcast
  hosts: proxmox_hosts
  become: true
  gather_facts: false
  strategy: linear
  any_errors_fatal: true

  environment:
    LC_ALL: C

  vars:
    fabric_id: main
    ospf_area: "0.0.0.0"
    fabric_ip_prefix: "10.0.0.0/16"
    fabric_interface: vmbr0
    apply_sdn: false

    vtep_addresses:
      mgmt1: "10.0.0.11"
      mgmt2: "10.0.0.12"
      mgmt3: "10.0.0.13"

  tasks:
    - name: Verify each target has a configured VTEP address
      ansible.builtin.assert:
        that:
          - inventory_hostname in vtep_addresses
        fail_msg: "No VTEP address configured for {{ inventory_hostname }}."

    - name: Generate backup timestamp
      ansible.builtin.command:
        argv:
          - date
          - "+%Y%m%d-%H%M%S"
      register: backup_timestamp
      changed_when: false

    - name: Set backup directory
      ansible.builtin.set_fact:
        backup_directory: "/root/sdn-before-ospf-{{ backup_timestamp.stdout }}"

    - name: Create private backup directory
      ansible.builtin.file:
        path: "{{ backup_directory }}"
        state: directory
        mode: "0700"

    - name: Back up cluster and node-local configuration
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup_directory }}/{{ item | basename }}"
        remote_src: true
        mode: preserve
      loop:
        - /etc/pve/sdn/fabrics.cfg
        - /etc/pve/sdn/controllers.cfg
        - /etc/frr/daemons
        - /etc/frr/frr.conf

    - name: Display backup location
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} backup: {{ backup_directory }}"

    - name: Stage OSPF fabric configuration once
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - "/cluster/sdn/fabrics/fabric/{{ fabric_id }}"
          - --protocol
          - ospf
          - --area
          - "{{ ospf_area }}"
          - --ip_prefix
          - "{{ fabric_ip_prefix }}"
      delegate_to: mgmt1
      run_once: true
      changed_when: true

    - name: Stage OSPF broadcast configuration for this node
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - "/cluster/sdn/fabrics/node/{{ fabric_id }}/{{ inventory_hostname }}"
          - --protocol
          - ospf
          - --ip
          - "{{ vtep_addresses[inventory_hostname] }}"
          - --interfaces
          - "name={{ fabric_interface }},network_type=broadcast"
      delegate_to: mgmt1
      throttle: 1
      changed_when: true

    - name: Read staged fabric configuration
      ansible.builtin.command:
        argv:
          - cat
          - /etc/pve/sdn/fabrics.cfg
      delegate_to: mgmt1
      run_once: true
      register: staged_fabric
      changed_when: false

    - name: Display staged fabric configuration
      ansible.builtin.debug:
        var: staged_fabric.stdout_lines
      run_once: true

    - name: Read EVPN controller configuration
      ansible.builtin.command:
        argv:
          - cat
          - /etc/pve/sdn/controllers.cfg
      delegate_to: mgmt1
      run_once: true
      register: controller_config
      changed_when: false

    - name: Display EVPN controller configuration
      ansible.builtin.debug:
        var: controller_config.stdout_lines
      run_once: true

    - name: Apply pending SDN configuration across the cluster
      ansible.builtin.command:
        argv:
          - pvesh
          - set
          - /cluster/sdn
      delegate_to: mgmt1
      run_once: true
      when: apply_sdn | bool
      changed_when: true

    - name: Report completion
      ansible.builtin.debug:
        msg: >-
          OSPF broadcast configuration
          {{ 'was applied across the cluster' if (apply_sdn | bool)
             else 'was staged only; networking was not applied' }}.
      run_once: true
