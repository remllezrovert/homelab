apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-postgres
  namespace: postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    storageClass: nfs-csi
    size: 10Gi
  bootstrap:
    initdb:
      database: public_db
      owner: admin
      secret:
